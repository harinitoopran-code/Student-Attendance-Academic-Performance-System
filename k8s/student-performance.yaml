apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-performance
spec:
  replicas: 1
  selector:
    matchLabels: {app: student-performance}
  template:
    metadata:
      labels: {app: student-performance}
    spec:
      containers:
      - name: web
        image: student-performance:1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: student-performance-service
spec:
  type: NodePort
  selector: {app: student-performance}
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30083
